
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | LunaCycle</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", sans-serif;
            color: #59425f;
            background: linear-gradient(135deg, #fff7fb, #f0eaff);
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: white;
            border: 1px solid #f0e1ee;
            border-radius: 24px;
            box-shadow: 0 12px 40px #79507812;
        }
        .logo { color: #bd7bb5; font-size: 25px; font-weight: bold; }
        h1 { font-size: 28px; }
        p { color: #8a7b8d; line-height: 1.6; }
        label { display: block; margin: 18px 0 7px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e8d9e8;
            border-radius: 10px;
            font: inherit;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: #bd7bb5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .bottom { margin-top: 22px; text-align: center; font-size: 14px; }
        a { color: #a15b99; }
        .error { color: #b34468; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">☾ LunaCycle</div>
        <h1>Welcome back 🌙</h1>
        <p>Sign in to continue your personal cycle journey.</p>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
                <p class="error">Please check your username and password.</p>
            {% endif %}

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>

            <button type="submit">Log in</button>
        </form>

        <div class="bottom">
            New to LunaCycle? <a href="{% url 'signup' %}">Create an account</a>
        </div>
    </div>
</body>
</html>
